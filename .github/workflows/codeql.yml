name: Security scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '28 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze and upload results
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}

  swift-source:
    name: Analyze Swift source patterns
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out pinned source scanner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: MobSF/mobsfscan
          ref: e48f780d04c4fdd38ec07c1de3d2210513f48ecd # 1.2.0
          path: .security-tools/mobsfscan
          persist-credentials: false

      - name: Set up scanner Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned scanner dependencies
        run: python -m pip install --disable-pip-version-check -r .security-tools/mobsfscan/requirements.txt

      # CodeQL traced Swift extraction does not support the app's Xcode 27 SDK.
      # Reuse Swift/Objective-C source rules without changing app build targets.
      - name: Scan Swift source and produce SARIF
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: |
          python -I - <<'PY'
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / '.security-tools/mobsfscan'))
          from mobsfscan import __version__
          from mobsfscan.mobsfscan import MobSFScan
          from mobsfscan.formatters.sarif import sarif_output

          paths = ['Memozia', 'MemoziaMCPHelper']
          results = MobSFScan(paths, json=True).scan()
          diagnostics = results.get('errors', [])
          fatal = [item for item in diagnostics if not isinstance(item, dict)
                   or str(item.get('level', 'error')).lower() not in {'warn', 'warning', 'info'}]
          if fatal:
              raise SystemExit(f'Swift source scan failed with {len(fatal)} execution errors: {fatal!r}')

          notifications = []
          for item in diagnostics:
              kind = item.get('type', 'Parser warning')
              if isinstance(kind, list):
                  kind = kind[0]
              message = f"Swift source coverage: {kind} in {item.get('path', 'unknown file')}"
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::warning::{escaped}')
              notifications.append({'level': 'warning', 'message': {'text': message}})

          report_path = pathlib.Path('swift-security.sarif')
          sarif_output(str(report_path), results, __version__, paths)
          report = json.loads(report_path.read_text(encoding='utf-8'))
          report['runs'][0]['invocations'][0]['toolExecutionNotifications'] = notifications
          report_path.write_text(json.dumps(report), encoding='utf-8')
          count = sum(max(1, len(item.get('files', []))) for item in results.get('results', {}).values())
          summary = f'Swift source scan: {count} findings; {len(diagnostics)} parser coverage warnings.'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('### Swift source security patterns\n\n' + summary + '\n\n')
              if notifications:
                  output.write('Files with parser warnings are not fully covered by these rules.\n\n')
                  for item in notifications:
                      output.write('- ' + item['message']['text'] + '\n')
          PY

      - name: Upload Swift source findings
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: swift-security.sarif
          category: /language:swift-source
          wait-for-processing: true
